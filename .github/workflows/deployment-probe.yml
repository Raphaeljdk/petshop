name: Deployment probe

on:
  push:
    branches:
      - codex/auth-clientes-administradores

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check available secrets safely
        env:
          DATABASE_SECRET: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$DATABASE_SECRET" ]; then echo "github_database_secret=yes"; else echo "github_database_secret=no"; fi
          if [ -n "$VERCEL_TOKEN_SECRET" ]; then echo "github_vercel_token=yes"; else echo "github_vercel_token=no"; fi
      - name: Wait for Vercel deployment
        run: sleep 45
      - name: Check public auth configuration
        run: |
          set -e
          echo "Auth configuration response:"
          curl -sS --fail-with-body https://petshop-ten-jade.vercel.app/api/health/auth-config
          echo
