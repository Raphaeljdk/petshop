name: Vitrine pública
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/landing/**'
      - 'src/components/auth/AuthScreen.tsx'
      - 'src/components/auth/storefront.css'
      - 'src/lib/storefront-*.ts'
      - 'src/app/api/public/**'
      - 'public/images/vitrine/**'
      - 'tests/storefront*'
      - 'tests/visual/**'
      - '.github/workflows/vitrine-publica.yml'
permissions:
  contents: read
concurrency:
  group: vitrine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  VERCEL_ENV: preview
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://localhost:1/storefront_ci
jobs:
  navegadores:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
      - run: npm install --prefix "$RUNNER_TEMP/vitrine" playwright@1.58.2
      - run: '"$RUNNER_TEMP/vitrine/node_modules/.bin/playwright" install --with-deps chrome msedge firefox webkit'
      - name: Validar Chrome, Edge, Firefox e WebKit
        shell: bash
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/vitrine/node_modules/playwright/index.mjs"
          failed=0
          for engine in chrome edge firefox webkit; do
            export STORE_BROWSER="$engine"
            case "$engine" in
              chrome) export STORE_BROWSER_CONFIG='{"channel":"chrome"}' ;;
              edge) export STORE_BROWSER_CONFIG='{"channel":"msedge"}' ;;
              *) unset STORE_BROWSER_CONFIG ;;
            esac
            node tests/storefront-ui.mjs || failed=1
          done
          exit "$failed"
  safari:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
      - run: sudo safaridriver --enable && node tests/storefront-safari.mjs
