name: Schema oficial NF-e
on:
  push:
    branches: [feat/xml-nfe-oficial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspecionar XSD oficial de homologação
        run: |
          python3 - <<'PY'
          import urllib.request,zipfile,io,hashlib,re
          url='https://hom.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=lxjvtPfGzo8%3D'
          data=urllib.request.urlopen(url,timeout=30).read()
          print('SHA256_ZIP',hashlib.sha256(data).hexdigest())
          z=zipfile.ZipFile(io.BytesIO(data))
          print('FILES',z.namelist())
          text=z.read(next(n for n in z.namelist() if n.endswith('/leiauteNFe_v4.00.xsd') or n=='leiauteNFe_v4.00.xsd')).decode('utf8')
          for m in re.finditer('ds:Signature|ICMSSN102|indIntermed|infIntermed',text):
            print(text[max(0,m.start()-140):m.start()+400])
          PY
