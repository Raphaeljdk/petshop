name: Schema oficial NF-e
on:
  push:
    branches: [feat/xml-nfe-oficial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Localizar arquivos no portal SVRS
        run: |
          python3 - <<'PY'
          import urllib.request,re
          data=urllib.request.urlopen('https://dfe-portal.svrs.rs.gov.br/Nfe/Documentos',timeout=30).read().decode('utf8')
          for line in data.splitlines():
            if any(k in line.lower() for k in ['download','010e','010f','schema','2025.002']): print(line[:2500])
          PY
