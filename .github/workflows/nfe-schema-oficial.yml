name: Schema oficial NF-e
on:
  push:
    branches: [feat/xml-nfe-oficial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Localizar arquivos no portal SVRS
        run: |
          python3 - <<'PY'
          import urllib.request,re
          data=urllib.request.urlopen('https://dfe-portal.svrs.rs.gov.br/Nfe/Documentos',timeout=30).read().decode('utf8')
          for path in re.findall(r'<script[^>]+src="([^\"]+)"',data):
            if path.startswith('http') and 'svrs' not in path: continue
            from urllib.parse import urljoin
            try:
              script=urllib.request.urlopen(urljoin('https://dfe-portal.svrs.rs.gov.br',path),timeout=15).read().decode('utf8')
              match=re.search('download_arquivo_estatico',script)
              if match: print(script[max(0,match.start()-100):match.start()+2000])
            except Exception as e: print(path,str(e))
          PY
