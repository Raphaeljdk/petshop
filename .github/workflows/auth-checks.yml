name: Authentication checks

on:
  push:
    branches: [main, 'codex/auth-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:/tmp/matilha-auth-test.db
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma and prepare isolated test database
        run: |
          bunx prisma validate
          bunx prisma generate
          bunx prisma db push
      - name: Lint
        run: bun run lint
      - name: Production build and TypeScript
        run: |
          bun run build
          bun run typecheck
      - name: Authentication integration tests
        run: bun run test:auth
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/matilha-browser" playwright@1.58.2
          "$RUNNER_TEMP/matilha-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser checks
        env:
          PLAYWRIGHT_MODULE: '${{ runner.temp }}/matilha-browser/node_modules/playwright/index.mjs'
        run: bun tests/auth-ui.mjs
      - name: Store interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-previews
          path: test-results/auth
          if-no-files-found: ignore
          retention-days: 7
