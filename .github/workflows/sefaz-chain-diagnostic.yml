name: Diagnostico publico TLS SEFAZ
on:
  push:
    paths:
      - '.github/workflows/sefaz-chain-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspecionar certificados publicos sem A1
        shell: bash
        run: |
          timeout 20 openssl s_client -connect homologacao.nfe.fazenda.sp.gov.br:443 -servername homologacao.nfe.fazenda.sp.gov.br -showcerts -tls1_2 </dev/null > /tmp/sefaz-chain.txt 2>&1 || true
          sed -n '/Certificate chain/,/Server certificate/p' /tmp/sefaz-chain.txt
          curl --fail --silent --show-error --max-time 20 http://acraiz.icpbrasil.gov.br/credenciadas/RAIZ/ICP-Brasilv10.crt -o /tmp/root.crt
          openssl x509 -inform DER -in /tmp/root.crt -out /tmp/root.pem || openssl x509 -in /tmp/root.crt -out /tmp/root.pem
          openssl x509 -in /tmp/root.pem -noout -subject -issuer -dates -fingerprint -sha256
          test "$(openssl x509 -in /tmp/root.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')" = "6C155ED7271A904A0DC040F0C857FF53BF6DB290"
          openssl verify -CAfile /tmp/root.pem /tmp/root.pem
          timeout 20 openssl s_client -connect homologacao.nfe.fazenda.sp.gov.br:443 -servername homologacao.nfe.fazenda.sp.gov.br -CAfile /tmp/root.pem -verify_hostname homologacao.nfe.fazenda.sp.gov.br -verify_return_error -tls1_2 </dev/null 2>&1 | sed -n '1,18p'
          cat /tmp/root.pem
