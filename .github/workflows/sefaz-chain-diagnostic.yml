name: Diagnostico publico TLS SEFAZ
on:
  push:
    paths:
      - '.github/workflows/sefaz-chain-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspecionar certificados publicos sem A1
        shell: bash
        run: |
          timeout 20 openssl s_client -connect homologacao.nfe.fazenda.sp.gov.br:443 -servername homologacao.nfe.fazenda.sp.gov.br -showcerts -tls1_2 </dev/null > /tmp/sefaz-chain.txt 2>&1 || true
          cat /tmp/sefaz-chain.txt
