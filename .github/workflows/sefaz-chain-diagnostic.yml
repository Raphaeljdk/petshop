name: Validacao TLS SEFAZ
on:
  push:
    paths:
      - '.github/workflows/sefaz-chain-diagnostic.yml'
      - 'src/lib/sefaz-sp-nfe.ts'
      - 'tests/sefaz-sp-nfe.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Testar certificado publico e diagnostico
        run: bun test tests/sefaz-sp-nfe.test.ts
      - name: Validar TLS real sem credenciais A1
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/lib/sefaz-sp-nfe.ts').read_text()
          cert = re.search(r'-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----', text).group()
          Path('/tmp/root.pem').write_text(cert)
          PY
          test "$(openssl x509 -in /tmp/root.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')" = "6E0BFF069A26994C15DE2C4888CC54AF84882E5495B7FBF66BE9CCFFEC7489F6"
          timeout 20 openssl s_client -connect homologacao.nfe.fazenda.sp.gov.br:443 -servername homologacao.nfe.fazenda.sp.gov.br -CAfile /tmp/root.pem -verify_hostname homologacao.nfe.fazenda.sp.gov.br -verify_return_error -tls1_2 -brief </dev/null
