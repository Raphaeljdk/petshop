name: Release build

on:
  push:
    branches:
      - main
      - feat/release-integracoes-siggma
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/matilha
      NEXTAUTH_SECRET: release-build-secret-release-build-secret
      SIGGMA_BASE_URL: https://example.invalid
      SIGGMA_CLIENT_ID: build
      SIGGMA_CLIENT_SECRET: build
      SIGGMA_EMP: 1-1
      MERCADO_PAGO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Etapa temporária da PR: resolver dependências e recuperar bun.lock atualizado.
      - run: bun install
      - name: Baixar pacote de schemas para conferência (temporário)
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 45 'https://www.reformatributaria.com/wp-content/uploads/2026/10/PL_010g_v1.03.zip' --output /tmp/PL_010g_v1.03.zip
          test "$(wc -c </tmp/PL_010g_v1.03.zip)" -lt 3000000
          unzip -t /tmp/PL_010g_v1.03.zip >/dev/null
          sha256sum /tmp/PL_010g_v1.03.zip
          unzip -Z1 /tmp/PL_010g_v1.03.zip | grep -E '(enviNFe|nfe_v4|leiauteNFe|tiposBasico|xmldsig)' | head -30
          echo 'FISCAL_SCHEMA_BEGIN'
          base64 -w1000 /tmp/PL_010g_v1.03.zip | sed 's/^/FISCAL_SCHEMA|/'
          echo 'FISCAL_SCHEMA_END'
      - name: Capturar lockfile resolvido (temporário)
        run: |
          echo 'FISCAL_LOCK_BEGIN'
          sed 's/^/FISCAL_LOCK|/' bun.lock
          echo 'FISCAL_LOCK_END'
      - run: bunx prisma generate --schema=prisma/schema.prisma
      - run: bun test tests/catalogo-servicos-matilha.test.ts
      - run: bun test tests/fiscal-preview.test.ts
      - run: bun test tests/nfe-xml-modelo55.test.ts
      - run: bun test tests/nfe-assinatura-a1.test.ts
      - run: bun test tests/sefaz-sp-nfe-homologacao.test.ts
      - run: bun test tests/fiscal-prontidao-producao.test.ts
      - run: bun test tests/fiscal-simples-produto.test.ts
      - run: bun test tests/fiscal-consulta-automatica.test.ts
      - run: bun test tests/fiscal-importacao-zetta.test.ts
      - run: bun test tests/fiscal-xml-entrada.test.ts
      - run: bun test tests/product-sku-groups.test.ts
      - run: bun test tests/fiscal-sku-reuse.test.ts
      - run: bun run test:customer-experience
      - run: bun run test:dashboard
      - run: bun run build
